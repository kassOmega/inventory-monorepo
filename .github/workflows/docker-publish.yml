name: Docker image

# Builds the combined frontend + backend image and pushes it to GHCR.
#
#   push to main        -> ghcr.io/<owner>/<repo>:main + :latest + :sha-<commit>
#   tag v1.2.3          -> :1.2.3, :1.2, :sha-<commit>
#   pull request        -> built only, never pushed
#
# Pull requests only verify that the image builds; they do not push, so forks
# without package permissions still get a green check.
on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR rejects uppercase repository names, and github.repository is
      # "kassOmega/inventory-monorepo", so lowercase it once and reuse.
      - name: Compute image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=inventory-monorepo
            org.opencontainers.image.description=Inventory management system (Next.js frontend + NestJS API)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Add linux/arm64 here (and a docker/setup-qemu-action@v3 step above)
          # if you deploy to ARM hosts.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* values are compiled into the browser bundle, so they
          # must be present here. "/api" makes the frontend call the backend
          # through its own origin (Next.js rewrites proxy it internally).
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Docker image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Pull request: image built but not pushed._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
